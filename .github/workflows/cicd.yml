name: cicd

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    container: php:8.2-fpm

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tools
      DB_USERNAME: root
      DB_PASSWORD: pass

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tools
          MYSQL_ROOT_PASSWORD: pass
        ports:
          - 3306:3306

    steps:
      # checkout
      - name: Setup file system permissions
        run: chmod -R 777 $GITHUB_WORKSPACE /github /__w/_temp
      - uses: actions/checkout@v4

      # os package install
      - name: install packages
        run: |
          apt-get update
          apt-get install -y libonig-dev libpq-dev zlib1g-dev libzip-dev \
              && docker-php-ext-install zip pdo_mysql

      # Setup app
      - name: Copy .env
        working-directory: ./src
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install php packages
        working-directory: ./src
        run: php composer.phar install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        working-directory: ./src
        run: php artisan key:generate

      - name: Make directories
        working-directory: ./src
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views

      - name: Directory Permissions
        working-directory: ./src
        run: chmod -R 777 storage bootstrap/cache

      - name: Install nodejs
        run: |
          curl -sL https://deb.nodesource.com/setup_16.x | bash -
          apt-get install -y --no-install-recommends nodejs

      - name: Install node packages
        working-directory: ./src
        run: |
          npm install -legacy-peer-deps
          npm run dev

      # php/node modules install
      - name: Cache php modules
        uses: actions/cache@v4
        env:
          cache-name: cache-php-modules
        with:
          path: ./src/vendor
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./src/composer.lock') }}
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ./src/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./src/package-lock.json') }}

      # setup database
      - name: setup database
        working-directory: ./src
        run: |
          php artisan migrate
          php artisan db:seed

      # run test
      - name: run test
        working-directory: ./src
        run: ./vendor/bin/phpunit

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build-and-test
#    if: github.ref == 'refs/heads/master'
    if: false # 停止

    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: github_ssh_key
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Setup Deployer
        working-directory: ./src
        run: curl -LO https://deployer.org/deployer.phar && mv deployer.phar ./dep  && chmod +x ./dep
      - name: deploy to prod
        working-directory: ./src
        run: ./dep deploy production -vvv
